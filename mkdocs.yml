site_name: The Ads Library
site_description: The whole system we use to run Meta ads, in one place.
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Start here: index.md
  - Foundations: foundations.md
  - Compliance and guardrails: compliance.md
  - 1 · Discovering your ICA:
      - Finding your ICA: finding-your-ica.md
      - The conversion quadrant: conversion-quadrant.md
  - 2 · Building your script:
      - Ad anatomy: ad-anatomy.md
      - Writing the body: writing-the-body.md
      - Hooks: hooks.md
  - 3 · Recording:
      - Recording: recording.md
      - Editing in CapCut: editing-capcut.md
      - Creative and b-roll: creative-broll.md
  - 4 · Posting in Meta:
      - Posting in Meta with Claude: posting-meta.md
      - Headlines and primary text: headlines-and-text.md
  - 5 · Tracking data:
      - Testing: testing.md
      - Understanding your KPIs: understanding-kpis.md
      - Metrics and optimizing: metrics.md
  - Templates:
      - Body script template: swipe-files/body-script.md
      - Hook bank template: swipe-files/hook-bank.md
      - Hook test tracker: swipe-files/hook-test-tracker.md
      - KPI trackers: swipe-files/kpi-trackers.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/brand-v2.css

extra:
  generator: false
